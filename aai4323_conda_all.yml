name: aai4323
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip

  # Required pinned versions
  - numpy=1.26.4
  - pandas=2.1.4

  # Scientific stack
  - scipy
  - scikit-learn
  - statsmodels
  - numba
  - numexpr
  - bottleneck

  # Jupyter ecosystem
  - jupyterlab
  - ipykernel
  - ipywidgets
  - notebook
  - nbconvert
  - nbformat
  - jupyter_client
  - jupyter_core

  # Visualization
  - matplotlib
  - seaborn
  - graphviz
  - python-graphviz

  # PyTorch CPU-only (macOS uses MPS automatically)
  - pytorch

  # Utilities
  - tqdm
  - psutil
  - requests
  - python-dateutil
  - pyyaml
  - joblib
  - cloudpickle

  # Pip-only packages
  - pip:
      - shap
      - imbalanced-learn
      - ucimlrepo
      - geopy
      - python-dotenv
      - networkx
